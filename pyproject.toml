[project]
name = "fifo-sync"
version = "0.1.0"
description = "HUD-formatted synchronous FIFO RTL problem with cocotb tests."
requires-python = ">=3.10"
dependencies = [
    "cocotb>=1.8.0",
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "cocotb-tools>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


